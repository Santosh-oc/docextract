[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "B008",  # FastAPI's Depends()-as-default is the documented idiom, not a bug
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008"]
"tests/conftest.py" = ["E402"]  # env vars + migrations must run before importing app.*
